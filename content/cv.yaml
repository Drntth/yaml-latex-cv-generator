        hu: Nyílt forrású Android alkalmazás, amely helyben tárolja a térképeket és útvonalakat, és hálózat nélkül rögzít.
      - en: Room database with background sync when the device is back online.
        hu: Room adatbázis háttérszinkronizálással, amikor az eszköz újra online.
    tech: [Kotlin, Room, WorkManager, MapLibre]

