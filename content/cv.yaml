# Every CV item in one place, in both languages (fictional sample data).
#
# Rules:
# - {en: ..., hu: ...}         language-dependent text; both keys are required.
# - {"@developer": ..., "@general": ...}
#                              variant-dependent value; empty if the variant is missing.
# - tags: [developer, general] the item appears only in these variants.
# - id:                        reference from variant and application files (hide, skills_order).
# - **text**                   bold.
# - Quote any value that contains a comma.

experience:
  - id: example-apps
    tags: [developer, general]
    period: {en: 2021 – present, hu: 2021 – jelenleg}
    role: {en: Mobile Developer, hu: Mobilfejlesztő}
    org: {en: Example Apps Ltd., hu: Example Apps Kft.}
    bullets:
      "@developer":
        - en: Development of a **Kotlin** and **Swift** retail app with offline mode and push notifications.
          hu: '**Kotlin** és **Swift** alapú kiskereskedelmi alkalmazás fejlesztése offline móddal és push értesítésekkel.'
        - en: Migration of the Android UI from XML layouts to Jetpack Compose.
          hu: Az Android felület átállítása XML layoutokról Jetpack Compose-ra.
        - en: Release automation for both app stores with Fastlane and GitHub Actions.
          hu: Kiadásautomatizálás mindkét alkalmazásboltba Fastlane-nel és GitHub Actions-szel.
      "@general":
        - en: App development in a product team, release planning and user feedback handling.
          hu: Alkalmazásfejlesztés termékcsapatban, kiadástervezés és felhasználói visszajelzések kezelése.
    tech:
      "@developer": [Kotlin, Swift, Jetpack Compose, SwiftUI, Firebase]
  - id: sample-studio
    tags: [developer, general]
    period: 2018 – 2021
    role: {en: Junior Android Developer, hu: Junior Android fejlesztő}
    org: {en: Sample Studio Ltd., hu: Sample Studio Kft.}
    bullets:
      "@developer":
        - en: Feature development and bug fixing for client apps written in Java and Kotlin.
          hu: Funkciófejlesztés és hibajavítás Java és Kotlin nyelvű ügyfélalkalmazásokban.
        - en: UI tests with Espresso for the most used user flows.
          hu: Felületi tesztek Espressóval a leggyakoribb felhasználói folyamatokra.
      "@general":
        - en: Software development for client projects, estimates and status reports.
          hu: Szoftverfejlesztés ügyfélprojektekben, becslések és státuszjelentések készítése.
  - id: library
    tags: [general]
    period: 2015 – 2018
    role: {en: Library Assistant (part-time), hu: Könyvtári asszisztens (részmunkaidő)}
    org: {en: Example City Library, hu: Example Városi Könyvtár}
    bullets:
      - en: Visitor service, catalogue maintenance and event organization.
        hu: Olvasószolgálat, katalógusgondozás és rendezvényszervezés.

